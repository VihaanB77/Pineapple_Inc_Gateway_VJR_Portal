<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" fill="none">
  <!-- Pineapple Crown / Leaves -->
  <g id="pineapple-leaves">
    <!-- Left outer leaf -->
    <path d="M 68 102 C 55 90 40 76 36 58 C 48 64 68 76 80 94 Z" fill="#58a741" />
    <path d="M 80 94 C 68 76 48 64 36 58 C 45 74 58 88 68 102 Z" fill="#478e33" opacity="0.3" />

    <!-- Right outer leaf -->
    <path d="M 132 102 C 145 90 160 76 164 58 C 152 64 132 76 120 94 Z" fill="#58a741" />
    <path d="M 120 94 C 132 76 152 64 164 58 C 155 74 142 88 132 102 Z" fill="#478e33" opacity="0.3" />

    <!-- Left middle leaf -->
    <path d="M 80 96 C 65 72 58 48 58 26 C 74 38 88 62 94 92 Z" fill="#62b849" />
    <path d="M 94 92 C 88 62 74 38 58 26 C 68 45 76 68 80 96 Z" fill="#4a9535" opacity="0.25" />

    <!-- Right middle leaf -->
    <path d="M 120 96 C 135 72 142 48 142 26 C 126 38 112 62 106 92 Z" fill="#62b849" />
    <path d="M 106 92 C 112 62 126 38 142 26 C 132 45 124 68 120 96 Z" fill="#4a9535" opacity="0.25" />

    <!-- Central upright leaf -->
    <path d="M 100 8 C 88 38 86 66 94 95 L 106 95 C 114 66 112 38 100 8 Z" fill="#6bc451" />
    <path d="M 100 8 C 96 36 96 66 100 95 L 106 95 C 114 66 112 38 100 8 Z" fill="#4c9a37" opacity="0.2" />
  </g>

  <!-- Pineapple Fruit Body -->
  <g id="pineapple-body">
    <!-- Clip path matching fruit oval -->
    <defs>
      <clipPath id="fruit-clip">
        <ellipse cx="100" cy="162" rx="46" ry="58" />
      </clipPath>
    </defs>

    <!-- Base orange fruit -->
    <ellipse cx="100" cy="162" rx="46" ry="58" fill="#f07c22" />

    <!-- Shadow gradient overlay for depth -->
    <ellipse cx="100" cy="162" rx="46" ry="58" fill="url(#fruit-shading)" />
    <defs>
      <linearGradient id="fruit-shading" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f89234" />
        <stop offset="60%" stop-color="#ee741b" />
        <stop offset="100%" stop-color="#df6310" />
      </linearGradient>
    </defs>

    <!-- Diamond lattice grid lines clipped to fruit shape -->
    <g clip-path="url(#fruit-clip)" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <!-- Diagonals top-left to bottom-right -->
      <line x1="30" y1="120" x2="130" y2="230" />
      <line x1="40" y1="100" x2="150" y2="220" />
      <line x1="55" y1="85" x2="165" y2="200" />
      <line x1="75" y1="75" x2="175" y2="180" />
      <line x1="100" y1="75" x2="185" y2="160" />
      <line x1="20" y1="150" x2="110" y2="245" />

      <!-- Diagonals top-right to bottom-left -->
      <line x1="170" y1="120" x2="70" y2="230" />
      <line x1="160" y1="100" x2="50" y2="220" />
      <line x1="145" y1="85" x2="35" y2="200" />
      <line x1="125" y1="75" x2="25" y2="180" />
      <line x1="100" y1="75" x2="15" y2="160" />
      <line x1="180" y1="150" x2="90" y2="245" />
    </g>

    <!-- Subtle rim highlight for clean finish -->
    <ellipse cx="100" cy="162" rx="46" ry="58" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.15" />
  </g>
</svg>
